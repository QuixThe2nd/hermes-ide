name: llm_usage_proxy
default_enabled: true
disabled_management: disabled_management
version: 1.1.0
description: "Bundled loopback reverse proxy that records real LLM token usage on the wire (z.ai, Kimi, Codex, xAI). Exposes the management CLI; measurement itself is opt-in per profile via `hermes llm_usage_proxy enable` and reroutes matching requests at the HTTP transport boundary, leaving provider identity, auth, and API modes untouched."
author: Hermes Agent
kind: backend
