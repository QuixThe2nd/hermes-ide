# Schema for the `discord_home_server:` section of HERMES_HOME/config.yaml.
#
# This file documents the shape — the plugin does NOT auto-load config from its
# own directory. Copy the keys below into HERMES_HOME/config.yaml (same
# convention as quota_channels) and enable the feature by setting guild_id.

discord_home_server:
  # Empty string = feature disabled. Set by /sethomeserver (or by hand) to the
  # Discord guild (server) ID that Hermes should treat as the home server.
  # Moving to a different guild requires an explicit `/sethomeserver confirm`.
  guild_id: ""

  # Module toggles. A disabled module is skipped entirely by reconcile: its
  # category is neither created nor wired, and its existing channels are left
  # untouched (reconcile never deletes anything). The listed order is the
  # canonical template order — enabled categories are seated top-down in it,
  # so Notifications (when enabled) is the topmost managed category.
  modules:
    notifications: true # Category "Notifications": text channels model-fallback, gateway-restarts, other
    chat: true          # Category "Chat": text channels inbox, outbox
    memory: true        # Category "Honcho Memory": explicit-facts, deductions, patterns, contradictions
    quotas: true        # Category "Models": voice channels Codex, Kimi, z.ai, Cursor, Grok
    speeds: true        # Category "Speeds": voice channels qBittorrent, SABnzbd, slskd
