name: Canary Release

# Publishes the source canary prerelease channel: a dated prerelease
# versioned over the newest stable tag (v<stable.patch+1>-canary.<timestamp>).
# Second-precision suffixes allow several manual canaries per day; the
# scheduled run publishes at most one because release.py skips when HEAD has
# no new commits since the last canary.
#
# Tag math, the skip gate, prerelease creation, and pruning live in
# scripts/release.py. This workflow only supplies a schedule and credentials,
# so `release.py --canary --publish` by hand follows the same path.
#
# schedule: is the ONE sanctioned time trigger in this repo (nightly
# exemption). Everything else stays event-driven.

on:
  schedule:
    - cron: '0 8 * * *' # daily, 0300 EST / 0800 UTC, middle of the night when most stuff will be moving less
  workflow_dispatch: {}

permissions:
  contents: write # tag push + release create/delete for prune

concurrency:
  group: canary-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and publish the canary prerelease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The changelog walks commits since the previous canary tag
          fetch-depth: 0
          # the tag math reads the full tag list
          fetch-tags: true

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py --canary --publish --remote origin

  prune:
    name: Prune canaries older than 14 days
    runs-on: ubuntu-24.04
    needs: tag
    # Prune even when there was nothing to tag today.
    if: always() && needs.tag.result != 'cancelled'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --prune-canaries --publish --remote origin
