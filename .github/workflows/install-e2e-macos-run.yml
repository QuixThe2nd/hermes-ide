# Reusable runner for ONE macOS install/update combination.
#
# Uses tests/install/installer-script-e2e.sh, the OS-agnostic git-redirect
# driver shared with Linux, for installer-script and hermes-update methods.
# Method pairs without a driver arm natively skip (grey check, no runner).

name: install-e2e macos leg

on:
  workflow_call:
    inputs:
      install-method:
        description: 'How OLD gets installed. Supported: installer-script (curl | bash one-liner).'
        required: true
        type: string
      update-method:
        description: 'How the install updates to HEAD. Supported: hermes-update and installer-script.'
        required: true
        type: string
      install-ref:
        description: 'What to install before updating: a branch, a tag, or a SHA reachable from main.'
        required: false
        type: string
        default: refs/heads/main
      leg-id:
        description: 'Artifact-safe matrix leg id (from generate-e2e-matrix.mjs legId). Names this leg''s logs + player artifacts so the report job can link a row to its zip.'
        required: true
        type: string
      timeout-minutes:
        description: 'Job timeout.'
        required: false
        type: number
        default: 60

permissions:
  contents: read

jobs:
  e2e:
    name: install & update
    if: >-
      inputs.install-method == 'installer-script'
      && contains(fromJSON('["hermes-update", "installer-script"]'), inputs.update-method)
    uses: ./.github/workflows/install-e2e-run.yml
    with:
      install-method: ${{ inputs.install-method }}
      update-method: ${{ inputs.update-method }}
      install-ref: ${{ inputs.install-ref }}
      leg-id: ${{ inputs.leg-id }}
      runner: macos-latest
      timeout-minutes: ${{ inputs.timeout-minutes }}
