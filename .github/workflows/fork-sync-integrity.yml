# Fork-only workflow: scheduled silent-drop detector for the fork's main.
# Do not upstream this file.
#
# fork-sync imports upstream one commit at a time and verifies ancestry —
# which cannot see the failure mode where a merge "completes" with a bad
# conflict resolution: the upstream commit becomes an ancestor, but an OLD
# version of the file lands on fork main. Ancestry-based sync then has
# nothing to redo and the content is gone silently. This workflow runs
# .github/scripts/fork-sync-integrity.py, which reports missing-import
# candidates, unresolved evidence, and observed fork-side changes as
# separate things.
#
# Exit codes: 0 assessed and clean, 2 missing-import candidates, 3
# unresolved evidence, 1 operational failure. Any nonzero fails the job red;
# 2 and 3 reach the existing DISCORD_SYNC_ALERT funnel (same one as
# fork-sync), 3 with no candidate paths listed inline.
#
# Scheduled at :53, offset from fork-sync's :23 so it runs after the hourly
# import. Pinned actions, full history, 30-minute bound, artifact on every
# outcome.
name: Fork sync integrity check

on:
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Detect and report but do not notify (checks the checker without side effects)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One check at a time, never cancelled mid-run; a queued run just re-checks
# the then-current refs when it starts.
concurrency:
  group: fork-sync-integrity
  cancel-in-progress: false

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTEGRITY_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      INTEGRITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # No `ref:` here on purpose: the job must execute the checker bytes that
      # shipped with the workflow revision GitHub selected, not whatever
      # `main` holds by the time the job starts (older, newer, or missing the
      # script entirely). Default checkout ref is github.sha, which is exactly
      # that revision. Full history — the checker walks both ancestries, and
      # it refuses a shallow clone outright.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main

      # The ref under examination is resolved explicitly to one immutable
      # commit instead of trusting the name `main` to mean the same thing at
      # checkout time and assessment time. Both SHAs go into the report, so a
      # finding stays reproducible long after either side moved on. `set -euo
      # pipefail` is deliberate: a ref that fails to resolve must fail this
      # step, never hand the checker an empty string.
      - name: Resolve the fork main under examination
        id: resolve
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          FORK_SHA="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          UPSTREAM_SHA="$(git rev-parse --verify 'refs/remotes/upstream/main^{commit}')"
          {
            echo "fork_sha=$FORK_SHA"
            echo "upstream_sha=$UPSTREAM_SHA"
          } >> "$GITHUB_OUTPUT"

      # Exit 2/3 fail this step red on purpose; the artifact below still
      # uploads. The script POSTs its own single-line alert (DiscordBot
      # User-Agent, allowed_mentions empty — the fork-sync-sequential.sh
      # convention) unless dry_run, which suppresses the POST only.
      - name: Check for silently dropped imported content
        id: integrity
        env:
          FORK_SHA: ${{ steps.resolve.outputs.fork_sha }}
          UPSTREAM_SHA: ${{ steps.resolve.outputs.upstream_sha }}
          DISCORD_SYNC_ALERT: ${{ secrets.DISCORD_SYNC_ALERT }}
        run: |
          python3 .github/scripts/fork-sync-integrity.py \
            --fork-ref "$FORK_SHA" \
            --upstream-ref "$UPSTREAM_SHA" \
            --json-out "$RUNNER_TEMP/fork-sync-integrity.json" \
            --max-report 10

      # Detail JSON either way — clean runs carry the totals and the
      # reconciliation, finding runs the full uncapped evidence. Best-effort:
      # an operational error (exit 1) writes no file, and that must not mask
      # the failure.
      - name: Upload integrity report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-sync-integrity-report
          path: ${{ runner.temp }}/fork-sync-integrity.json
          if-no-files-found: ignore

# Remaining hosted-run boundary: this file only becomes dispatchable by
# filename once it exists on the default branch — GitHub registers
# workflow_dispatch from the default branch's copy, so `gh workflow run
# fork-sync-integrity.yml` against this branch fails until it lands there.
# The checkout/ref behaviour above is proven locally by
# tests/scripts/test_fork_sync_integrity.py, which executes the resolve
# step's commands against real local remotes; the hosted schedule itself is
# not exercised from here.
