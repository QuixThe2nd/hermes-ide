name: rescue-tests
on:
  workflow_dispatch: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap uv and run targeted trio + new tests
        shell: bash
        run: |
          python -m pip install --quiet uv
          uv sync --frozen --all-groups || uv sync --all-groups
          uv run --frozen pytest tests/gateway/test_webhook_adapter.py tests/gateway/test_discord_plugin_setup.py tests/hermes_cli/test_send_cmd.py tests/gateway/test_discord_free_response.py -q
