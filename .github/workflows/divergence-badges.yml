name: Divergence badges

# Refreshes the Divergence section of README.md after pushes to main.
# NOTE: the upstream fetch inside scripts/divergence_badges.py is a READ-ONLY
# ancestry comparison against NousResearch/hermes-agent — never a sync, merge,
# or push target.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md'] # the badge commit itself must not retrigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: divergence-badges
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Refresh badges on latest main, commit, push
        # BADGE_PUSH_PAT (owner fine-grained PAT, contents:write on this repo)
        # is required: Protect Main bypasses only the owner account, so
        # GITHUB_TOKEN and App-installation pushes are both rejected (GH013,
        # "push declined due to repository rule violations") and the badges
        # silently rot. App-token pushes would also retrigger workflows.
        #
        # main moves between checkout and push on this repo; committing on the
        # checkout-time SHA lost every push race since Nov 15 ("! [rejected]
        # main -> main (fetch first)"). The README edit is the ONLY local
        # change this workflow ever makes, so instead of rebasing: fetch the
        # current tip, discard any stale edit, hard-reset onto it, and
        # recompute the badge region there. If the push STILL races, refetch
        # and recompute — bounded at 3 attempts, then fail loudly.
        env:
          BADGE_TOKEN: ${{ secrets.BADGE_PUSH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${BADGE_TOKEN:-}" ]; then
            echo "::error::secret BADGE_PUSH_PAT is not set on this repo; the badge push cannot bypass Protect Main. Add the owner fine-grained PAT (contents:write) as BADGE_PUSH_PAT."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # push-url-local: the credential travels only to the push, never to fetch.
          git remote set-url --push origin "https://x-access-token:${BADGE_TOKEN}@github.com/QuixThe2nd/hermes-ide.git"
          cleanup_url() { git remote set-url --push origin https://github.com/QuixThe2nd/hermes-ide.git; }
          trap cleanup_url EXIT
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -- README.md 2>/dev/null || true # drop any stale edit from a prior attempt
            git reset --hard origin/main # safe: README.md is the only local change, recomputed below
            python scripts/divergence_badges.py --repo . --readme README.md
            git add README.md
            if git diff --cached --quiet; then
              echo "Badge region unchanged; nothing to commit."
              exit 0
            fi
            git commit -m "chore(readme): refresh divergence badges"
            if git push; then
              echo "Badge commit pushed (attempt $attempt)."
              exit 0
            fi
            echo "::warning::push raced origin/main (attempt $attempt/3); refetching and recomputing"
          done
          echo "::error::divergence badges: lost the push race to origin/main 3 times in a row; re-run this workflow once main settles."
          exit 1
