# Reusable runner for ONE Windows install/update combination.
#
# tests/install/windows-e2e.ps1 installs the old ref through its real
# install.ps1, then updates through `hermes update` or a current installer
# re-run. Each phase shares state through the isolated workroot.
#
# Method pairs without a driver arm natively skip (grey check, no runner).

name: install-e2e windows leg

on:
  workflow_call:
    inputs:
      install-method:
        description: 'How OLD gets installed. Supported: installer-script (irm | iex install.ps1).'
        required: true
        type: string
      update-method:
        description: 'How the install updates to HEAD. Supported: hermes-update and installer-script.'
        required: true
        type: string
      install-ref:
        description: 'Ref to install as OLD (served as main while the installer runs). auto = the newest release tag in the checkout.'
        required: false
        type: string
        default: auto
      leg-id:
        description: 'Artifact-safe matrix leg id (from generate-e2e-matrix.mjs legId). Names this leg''s logs + player artifacts so the report job can link a row to its zip.'
        required: true
        type: string
      timeout-minutes:
        description: 'Job timeout. The install and update legs do real toolchain work.'
        required: false
        type: number
        default: 60

permissions:
  contents: read

jobs:
  e2e:
    # Short static name on purpose: name expressions render UNEXPANDED on
    # skipped jobs.
    name: e2e
    # The implemented {install x update} pairs; anything else natively skips.
    if: >-
      inputs.install-method == 'installer-script'
      && contains(fromJSON('["hermes-update", "installer-script"]'), inputs.update-method)
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    env:
      # Sibling of the checkout (D:\a\hermes-agent\hermes-install-e2e):
      # outside the repo so the staged bare clone and the install never
      # collide with the checkout itself. NOTE: ${{ runner.temp }} is NOT
      # available in job-level env (only github/inputs/matrix/needs/
      # secrets/strategy/vars).
      HERMES_E2E_WORKROOT: ${{ github.workspace }}\..\hermes-install-e2e

    steps:
      # Full history: the driver bare-clones this checkout as the repo the
      # installer/updater talk to, and both OLD and HEAD must be reachable
      # in that clone. A shallow checkout cannot serve either need.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # One recording mechanism on every OS: the composite action installs
      # ffmpeg (cached - winget's download is the slow part), starts the
      # capture, and record-stop fails on a zero-frame file so a silently
      # missing recording cannot go green.
      - name: Start screen recording
        uses: ./.github/actions/e2e-screen-record
        with:
          mode: start
          output: ${{ github.workspace }}\install-e2e-proof\recording.mkv

      - name: Stage serve repo (main -> ${{ inputs.install-ref }})
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\install\windows-e2e.ps1 -Phase stage -InstallMethod "${{ inputs.install-method }}" -Route "${{ inputs.update-method }}" -InstallRef "${{ inputs.install-ref }}"

      - name: Install ${{ inputs.install-ref }} (${{ inputs.install-method }})
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\install\windows-e2e.ps1 -Phase install -InstallMethod "${{ inputs.install-method }}" -Route "${{ inputs.update-method }}" -InstallRef "${{ inputs.install-ref }}"

      - name: Update ${{ inputs.install-ref }} -> HEAD (${{ inputs.update-method }})
        id: update
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\install\windows-e2e.ps1 -Phase update -InstallMethod "${{ inputs.install-method }}" -Route "${{ inputs.update-method }}" -InstallRef "${{ inputs.install-ref }}"

      - name: Stage known-failure receipt
        if: steps.update.outputs.known_failure != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path install-e2e-proof -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:HERMES_E2E_WORKROOT 'known-failure.json') -Destination install-e2e-proof/known-failure.json

      - name: Upload known-failure receipt
        if: steps.update.outputs.known_failure != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-e2e-known-${{ steps.update.outputs.known_failure }}--${{ inputs.leg-id }}
          path: install-e2e-proof/known-failure.json
          if-no-files-found: error
          retention-days: 14

      - name: Stop screen recording
        if: always()
        uses: ./.github/actions/e2e-screen-record
        with:
          mode: stop
          output: ${{ github.workspace }}\install-e2e-proof\recording.mkv

      - name: Remux recording for browser playback
        if: always()
        shell: pwsh
        run: |
          $mkv = "$env:GITHUB_WORKSPACE\install-e2e-proof\recording.mkv"
          if (Test-Path -LiteralPath $mkv) {
            & ffmpeg -y -hide_banner -loglevel error -i $mkv -c copy "$env:GITHUB_WORKSPACE\install-e2e-proof\recording.mp4"
          }

      - name: Collect proof + logs
        if: always()
        shell: powershell
        run: |
          $out = "install-e2e-proof"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $work = $env:HERMES_E2E_WORKROOT
          $home_ = Join-Path $work "hermes-home"
          foreach ($pair in @(
            @{ src = (Join-Path $work "proof");                          dst = "proof" },
            @{ src = (Join-Path $work "logs");                           dst = "driver-logs" },
            @{ src = (Join-Path $work "shas.json");                      dst = "shas.json" },
            @{ src = (Join-Path $home_ "logs");                          dst = "logs" },
            @{ src = (Join-Path $home_ ".hermes-update-result.json");    dst = ".hermes-update-result.json" }
          )) {
            if (Test-Path $pair.src) { Copy-Item $pair.src (Join-Path $out $pair.dst) -Recurse -Force }
          }

      - name: Upload proof + logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-e2e-logs-${{ inputs.leg-id }}
          path: install-e2e-proof
          retention-days: 14
          if-no-files-found: ignore
