# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:

jobs:
  check:
    name: JS & TS checks
    # One standard GitHub-hosted job replaces a 14-leg matrix. The matrix
    # spread about 612s of check payload over 4-core runners. It paid about
    # 371s of repeated setup to do it: 14 checkouts, 14 node installs, 14
    # node_modules restores.
    #
    # One runner installs one time. vitest, tsc and eslint each size their own
    # worker pool from the available core count.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@v7.0.0 # immutable release. safe to pin.
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        run: |
          # No-op once the bundled npm is already 12.x — saves ~5-15s/job and
          # keeps the installed major aligned with the npm12 cache-key tag.
          npm --version | grep -q '^12\.' || npm i -g npm@12

      # The ``cache: npm`` option of ``setup-node`` caches only the ~/.npm
      # tarball cache. The job then extracts the full workspace node_modules
      # again and runs the postinstalls again. This caches the installed tree
      # itself, keyed on the lockfile, and skips ``npm ci`` on an exact hit.
      # There are no restore-keys: a partial hit leaves a stale tree, so
      # anything other than an exact lockfile match reinstalls from the start.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            tests-js/node_modules
          key: node-modules-scripts-${{ runner.os }}-node26-npm12-${{ hashFiles('package-lock.json') }}

      - uses: ./.github/actions/retry
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          command: npm ci

      # Every check runs at the same time. The step fails only after all of
      # them finish. There are two reasons this is not ``npm run --ws check``.
      #
      #   * ``--ws`` is serial and stops at the first workspace that fails. A
      #     run then reports one failure, where the matrix this replaced
      #     reported every failure together.
      #   * The unit of work is a CHECK, and not a workspace. Expanding each
      #     package's ``check:*`` sub-scripts lets independent lint, typecheck,
      #     and test suites run together instead of forming one long chain.
      #
      # Discovery is ``npm query .workspace``. A new package or a new
      # ``check:*`` script needs no change here. An empty list is an error and
      # not an empty run, because an empty run reports green after it checks
      # nothing.
      - name: Run all workspace checks
        run: node .github/scripts/run-workspace-checks.mjs
