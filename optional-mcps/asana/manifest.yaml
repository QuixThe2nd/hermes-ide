# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: asana
description: >-
  Tasks, projects, and goals from your Asana workspace.
source: https://developers.asana.com/docs/using-asanas-mcp-server

# Asana's V2 remote MCP uses Streamable HTTP. It requires a user-owned,
# pre-registered Asana MCP app with static OAuth client credentials.
# V2 does not support Dynamic Client Registration. Hermes preserves its OAuth
# callback flow and uses the configured client credentials for token exchange
# and refresh.
transport:
  type: http
  url: https://mcp.asana.com/v2/mcp

auth:
  type: oauth

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - asana
  hosts:
    - asana.com

post_install: |
  Before logging in, create an Asana MCP app in the Asana developer console
  and register Hermes's exact callback URL. The default is
  http://localhost:27890/callback; if you configure a different redirect host
  or port, register that exact URL instead.

  Store the app's client ID and client secret outside source control (for
  example, as ASANA_CLIENT_ID and ASANA_CLIENT_SECRET in the active profile's
  .env), then add them to this server's oauth configuration:

    mcp_servers:
      asana:
        oauth:
          client_id: "${ASANA_CLIENT_ID}"
          client_secret: "${ASANA_CLIENT_SECRET}"

  Run `hermes mcp login asana`, approve access in the browser, and reload or
  restart the Hermes session or gateway that should expose the Asana tools.
